# jdx/mise-action installs only releases older than a day, so a newer one would fail CI.
min_version = '2026.10.19'

[settings]
lockfile = true # DO NOT FORGET TO `touch mise.lock` if mise.lock does not exist!
npm.package_manager = 'pnpm' # Avoid .mise/locks/** sidecars required by default aube.


[tools]
node = 'lts'
pnpm = 'latest'
# Use aqua because of https://github.com/mise-plugins/vfox-neovim/issues/1.
'aqua:neovim/neovim' = 'latest'

#--- Format
# Opinionated Code Formatter.
prettier = 'latest'
# A TOML toolkit written in Rust.
taplo = 'latest'
# An extensible command line tool or library to format yaml files.
yamlfmt = 'latest'
# An opinionated Lua code formatter.
stylua = 'latest'

#--- Lint
# Static checker for GitHub Actions workflow files.
actionlint = 'latest'
# A CLI tool for code structural search, lint and rewriting.
ast-grep = 'latest'


[tasks.fmt]
description = 'Format all files'
depends = ['fmt:*']

[tasks.lint]
description = 'Run all linters'
depends = ['lint:*']

[tasks.test]
description = 'Run all tests'
depends = ['test:*']

[tasks.default]
description = 'Run all formatters, linters and tests'
depends = ['fmt', 'lint', 'test']

[tasks.ci]
description = 'Run all CI tasks'
depends = ['fmt', 'lint', 'test']
# Is working tree clean after fmt?
run = '! git status --porcelain | tee /dev/stderr | grep -q .'

[tasks.'fmt:markdown']
description = 'Format markdown files'
sources = ['**/*.md']
run = 'prettier --write "**/*.md"'

# Taplo doesn't respect .gitignore.
[tasks.'fmt:toml']
description = 'Format TOML files'
sources = ['**/*.toml']
env.RUST_LOG = 'warn' # Hide INFO logs of taplo.
run = "git ls-files -z -co --exclude-standard '*.toml' | xargs -0 -r taplo format"

[tasks.'fmt:yaml']
description = 'Format YAML files'
sources = ['**/*.yml', '**/*.yaml']
run = "git ls-files -z -co --exclude-standard '*.yml' '*.yaml' | xargs -0 -r yamlfmt"

[tasks.'fmt:stylua']
description = 'Format Lua code'
run = 'stylua .'

[tasks.'lint:workflows']
description = 'Lint GitHub Action workflows'
run = 'actionlint'

[tasks.'lint:markdown']
description = 'Lint markdown files'
wait_for = ['fmt:markdown']
sources = ['**/*.md']
run = 'prettier --check "**/*.md"'

[tasks.'lint:toml']
description = 'Check TOML files formatting'
wait_for = ['fmt:toml']
sources = ['**/*.toml']
env.RUST_LOG = 'warn' # Hide INFO logs of taplo.
run = "git ls-files -z -co --exclude-standard '*.toml' | xargs -0 -r taplo format --check"

[tasks.'lint:yaml']
description = 'Check YAML files formatting'
wait_for = ['fmt:yaml']
sources = ['**/*.yml', '**/*.yaml']
run = "git ls-files -z -co --exclude-standard '*.yml' '*.yaml' | xargs -0 -r yamlfmt -lint"

[tasks.'lint:stylua']
description = 'Check Lua code formatting'
run = 'stylua --check .'

[tasks.'lint:ast-grep']
description = 'Lint using ast-grep custom rules'
run = 'ast-grep scan'

[tasks.'test:plenary']
description = 'Test Neovim config using Plenary'
usage = '''
arg "[test]"
complete "test" run="cd tests && fd -tf -td -E minimal_init.lua"
'''
run = 'nvim --headless -u run_plenary.vim +qa -- tests/${usage_test}'

[tasks.cachedir]
hide = true
run = 'mkdir -p .cache'
